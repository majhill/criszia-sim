<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cre8tive Consulting Simulator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    h1 {
      color: #1f3c88;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #555;
      margin-bottom: 30px;
    }

    .progress {
      margin-bottom: 25px;
      font-weight: bold;
      color: #1f6feb;
    }

    .scenario-box {
      background: #eef4ff;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    .choice {
      display: block;
      width: 100%;
      margin-bottom: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1f6feb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      text-align: left;
    }

    .choice:hover {
      background: #174ea6;
    }

    #feedback {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 10px;
      background: #f0f8f2;
      color: #1f4d2b;
      font-weight: bold;
    }

    #nextBtn {
      display: none;
      margin-top: 20px;
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #28a745;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #scoreBox {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
      color: #1f3c88;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Parent Advocacy Simulator</h1>

  <div class="subtitle">
    Cre8tive Consulting — Educating and empowering parents to advocate effectively for their children.
  </div>

  <div class="progress" id="progress">
    Scenario 1 of 3
  </div>

  <div class="scenario-box">
    <h2 id="scenarioTitle"></h2>
    <p id="scenarioText"></p>
  </div>

  <div id="choices"></div>

  <div id="feedback"></div>

  <button id="nextBtn" onclick="nextScenario()">
    Continue to Next Scenario
  </button>

  <div id="scoreBox">
    Advocacy Score: 0
  </div>

  <div class="footer">
    Interactive MVP Simulator
  </div>

</div>

<script>

const scenarios = [

{
  title: "Scenario 1: School Meeting Preparation",
  text: "You are preparing for a school meeting regarding your child’s academic progress. What should you do first?",
  choices: [
    {
      text: "Review grades, notes, prior communication, and examples before attending.",
      feedback: "Excellent. Strong advocacy begins with preparation and documentation.",
      points: 10
    },
    {
      text: "Immediately accuse the school of failing your child.",
      feedback: "This may create conflict before productive communication begins.",
      points: 0
    },
    {
      text: "Wait and see what the school says first.",
      feedback: "Listening matters, but preparation should happen before the meeting.",
      points: 5
    }
  ]
},

{
  title: "Scenario 2: Emotional Conversation",
  text: "During the meeting, emotions rise and the conversation becomes tense. What is your best response?",
  choices: [
    {
      text: "Stay calm, ask clarifying questions, and refocus on solutions.",
      feedback: "Excellent leadership and advocacy approach.",
      points: 10
    },
    {
      text: "Raise your voice so they understand your frustration.",
      feedback: "Emotional escalation often weakens communication.",
      points: 0
    },
    {
      text: "End the meeting immediately and leave.",
      feedback: "Sometimes breaks help, but ending communication too early may limit progress.",
      points: 4
    }
  ]
},

{
  title: "Scenario 3: Follow-Up Action",
  text: "The meeting is over. What should you do next?",
  choices: [
    {
      text: "Send a respectful follow-up email documenting key points and next steps.",
      feedback: "Outstanding. Documentation and follow-through are critical advocacy skills.",
      points: 10
    },
    {
      text: "Assume the school will handle everything now.",
      feedback: "Strong advocates continue monitoring progress after meetings.",
      points: 2
    },
    {
      text: "Post complaints publicly online immediately.",
      feedback: "Public escalation should rarely be the first follow-up step.",
      points: 1
    }
  ]
}

];

let currentScenario = 0;
let score = 0;

function loadScenario() {

  document.getElementById("feedback").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";

  const scenario = scenarios[currentScenario];

  document.getElementById("scenarioTitle").innerText = scenario.title;
  document.getElementById("scenarioText").innerText = scenario.text;

  document.getElementById("progress").innerText =
    `Scenario ${currentScenario + 1} of ${scenarios.length}`;

  const choicesDiv = document.getElementById("choices");
  choicesDiv.innerHTML = "";

  scenario.choices.forEach(choice => {

    const btn = document.createElement("button");

    btn.className = "choice";

    btn.innerText = choice.text;

    btn.onclick = () => selectChoice(choice);

    choicesDiv.appendChild(btn);

  });

}

function selectChoice(choice) {

  score += choice.points;

  document.getElementById("scoreBox").innerText =
    `Advocacy Score: ${score}`;

  const feedback = document.getElementById("feedback");

  feedback.innerText = choice.feedback;

  feedback.style.display = "block";

  document.querySelectorAll(".choice").forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = "0.7";
  });

  document.getElementById("nextBtn").style.display = "inline-block";

}

function nextScenario() {

  currentScenario++;

  if (currentScenario < scenarios.length) {

    loadScenario();

  } else {

    document.querySelector(".scenario-box").innerHTML = `
      <h2>Simulation Complete</h2>
      <p>You completed the Parent Advocacy Simulator.</p>
      <p>Your final Advocacy Score is <strong>${score}</strong>.</p>
      <p>Strong advocacy combines preparation, professionalism, communication, and follow-through.</p>
    `;

    document.getElementById("choices").style.display = "none";
    document.getElementById("feedback").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";

    document.getElementById("progress").innerText =
      "Completed";

  }

}

loadScenario();

</script>

</body>
</html>
